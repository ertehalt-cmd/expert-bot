<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIGNAL">
<title>SIGNAL ⚡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0f;color:#e0e0ff;font-family:system-ui,-apple-system,sans-serif;min-height:100dvh;overflow-x:hidden}

.app{max-width:400px;margin:0 auto;padding:10px 12px 24px}

/* HEADER */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 0 8px;border-bottom:1px solid #1a1a2e;margin-bottom:10px}
.logo{font-size:1.1rem;font-weight:800;letter-spacing:3px;background:linear-gradient(135deg,#fff,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.clk{font-size:.75rem;font-family:monospace;color:#7c3aed;letter-spacing:1px}

/* SESSIONS */
.sessions{display:flex;gap:3px;margin-bottom:8px}
.sess{flex:1;background:#111118;border:1px solid #1a1a2e;border-radius:6px;padding:5px 2px;text-align:center}
.sess.on{border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.04)}
.sess.best{border-color:rgba(124,58,237,.4);background:rgba(124,58,237,.06)}
.sess-f{font-size:.7rem;display:block}
.sess-n{font-size:.38rem;color:#4a4a6a;display:block;margin:1px 0}
.sess-s{font-size:.38rem;font-weight:700;padding:1px 3px;border-radius:3px;display:inline-block}
.sess-s.on{background:rgba(16,185,129,.15);color:#10b981}
.sess-s.off{background:#1a1a2e;color:#4a4a6a}
.sess-s.best{background:rgba(124,58,237,.15);color:#a78bfa}

/* MKT */
.mkt{border-radius:7px;padding:6px 10px;display:flex;align-items:center;gap:7px;margin-bottom:8px;border:1px solid}
.mkt.fire{background:rgba(124,58,237,.05);border-color:rgba(124,58,237,.2)}
.mkt.go{background:rgba(16,185,129,.04);border-color:rgba(16,185,129,.15)}
.mkt.stop{background:rgba(239,68,68,.03);border-color:rgba(239,68,68,.12)}
.mkt-icon{font-size:.85rem}
.mkt-t{font-size:.62rem;font-weight:700;display:block}
.mkt-s{font-size:.5rem;color:#4a4a6a;display:block}

/* CHART */
.chart-wrap{background:#111118;border:1px solid #1a1a2e;border-radius:8px;overflow:hidden;margin-bottom:8px}
.chart-top{padding:6px 10px;border-bottom:1px solid #1a1a2e;display:flex;justify-content:space-between;align-items:center}
.chart-lbl{font-size:.48rem;color:#4a4a6a;letter-spacing:1.5px;text-transform:uppercase}
.chart-tf{font-size:.6rem;color:#10b981;font-family:monospace}
#tv{width:100%;height:260px;border:none;display:block}

/* TF + BTN */
.row{display:flex;gap:5px;margin-bottom:8px}
.tf-grp{display:flex;gap:2px;background:#111118;border:1px solid #1a1a2e;border-radius:7px;padding:3px}
.tf{padding:5px 12px;border-radius:5px;border:none;background:transparent;color:#4a4a6a;font-size:.65rem;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
.tf.on{background:#7c3aed;color:#fff;box-shadow:0 0 10px rgba(124,58,237,.3)}
.btn{flex:1;padding:10px;border:none;border-radius:7px;background:#7c3aed;color:#fff;font-size:.8rem;font-weight:800;cursor:pointer;letter-spacing:.5px;box-shadow:0 0 16px rgba(124,58,237,.25);transition:all .2s;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.spin{display:inline-block;width:10px;height:10px;border:1.5px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp .5s linear infinite;vertical-align:middle;margin-left:3px}
@keyframes sp{to{transform:rotate(360deg)}}
.btn-r{padding:10px 11px;border:1px solid #1a1a2e;border-radius:7px;background:#111118;color:#7c3aed;cursor:pointer;font-size:.9rem}

/* SIGNAL */
.sig{background:#111118;border:1px solid #1a1a2e;border-radius:10px;overflow:hidden;margin-bottom:8px;transition:all .4s}
.sig.call{border-color:rgba(16,185,129,.35);box-shadow:0 0 20px rgba(16,185,129,.08)}
.sig.put{border-color:rgba(239,68,68,.35);box-shadow:0 0 20px rgba(239,68,68,.08)}
.sig.dm{border-color:rgba(124,58,237,.5);box-shadow:0 0 25px rgba(124,58,237,.12)}
.sig-body{padding:16px 14px 12px;text-align:center;border-bottom:1px solid #1a1a2e}
.sig-sub{font-size:.45rem;color:#4a4a6a;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.sig-arrow{font-size:2rem;line-height:1;margin-bottom:3px}
.sig-dir{font-family:monospace;font-size:1.3rem;font-weight:900;letter-spacing:4px;display:block}
.sig-dir.call{color:#10b981}.sig-dir.put{color:#ef4444}.sig-dir.dm{color:#a78bfa}.sig-dir.wait{color:#4a4a6a}
.sig-grade{font-size:.62rem;font-weight:700;margin-top:3px;display:block}
.gd{color:#10b981}.gp{color:#ef4444}.gm{color:#a78bfa}.gw{color:#4a4a6a}
.sig-info{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.badge{font-family:monospace;font-size:.48rem;padding:2px 7px;border-radius:15px;border:1px solid}
.bt{border-color:rgba(124,58,237,.25);color:#a78bfa;background:rgba(124,58,237,.06)}
.be{border-color:rgba(245,158,11,.2);color:#f59e0b;background:rgba(245,158,11,.04)}
.bg{border-color:rgba(16,185,129,.2);color:#10b981;background:rgba(16,185,129,.04)}

/* CONF */
.conf{padding:9px 14px 3px;display:none}
.conf-r{display:flex;justify-content:space-between;font-size:.52rem;color:#4a4a6a;margin-bottom:4px}
.conf-v{font-family:monospace;font-weight:700;color:#7c3aed}
.conf-bar{height:3px;border-radius:2px;background:#1a1a2e;overflow:hidden}
.conf-fill{height:100%;border-radius:2px;width:0;transition:width 1s ease}
.cf-dm{background:linear-gradient(90deg,#5b21b6,#a78bfa)}
.cf-hi{background:linear-gradient(90deg,#065f46,#10b981)}
.cf-md{background:linear-gradient(90deg,#78350f,#f59e0b)}
.cf-lo{background:linear-gradient(90deg,#7f1d1d,#ef4444)}

/* AGREE */
.agree{padding:7px 14px;display:none}
.agree-lbl{font-size:.45rem;color:#4a4a6a;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.agree-segs{display:flex;gap:2px}
.seg{flex:1;height:3px;border-radius:2px;background:#1a1a2e;transition:all .4s}
.seg.on.call{background:#10b981}.seg.on.put{background:#ef4444}.seg.on.dm{background:#a78bfa}
.agree-n{font-family:monospace;font-size:.58rem;color:#7c3aed;margin-top:3px;display:block}

/* TAGS */
.tags{display:flex;flex-wrap:wrap;gap:3px;padding:7px 14px 10px}
.tag{font-size:.52rem;font-weight:600;padding:2px 6px;border-radius:4px;border:1px solid}
.tb{background:rgba(16,185,129,.05);border-color:rgba(16,185,129,.15);color:#6ee7b7}
.tr{background:rgba(239,68,68,.05);border-color:rgba(239,68,68,.15);color:#fca5a5}
.tv{background:rgba(124,58,237,.05);border-color:rgba(124,58,237,.15);color:#a78bfa}
.tn{background:#111118;border-color:#1a1a2e;color:#4a4a6a}

/* TIMER */
.tmr{background:#111118;border:1px solid #1a1a2e;border-radius:7px;padding:8px 11px;display:flex;align-items:center;gap:9px;margin-bottom:8px;transition:all .3s}
.tmr.on{border-color:rgba(245,158,11,.3)}
.tmr-body{flex:1}
.tmr-lbl{font-size:.45rem;color:#4a4a6a;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.tmr-val{font-family:monospace;font-size:.9rem;color:#f59e0b;letter-spacing:2px;font-weight:700}
.tmr-bar{height:2px;border-radius:1px;background:#1a1a2e;margin-top:3px;overflow:hidden}
.tmr-fill{height:100%;border-radius:1px;background:linear-gradient(90deg,#f59e0b,#7c3aed);transition:width 1s linear}
.tmr-tf{text-align:left;font-size:.45rem;color:#4a4a6a;line-height:1.5}
.tmr-tf b{display:block;font-family:monospace;font-size:.6rem;color:#a78bfa}

/* PAT */
.pat{display:none;align-items:center;gap:6px;background:rgba(245,158,11,.03);border:1px solid rgba(245,158,11,.15);border-radius:6px;padding:6px 10px;margin-bottom:8px}
.pat.show{display:flex}
.pat-n{color:#f59e0b;font-weight:700;font-size:.6rem}
.pat-d{color:#4a4a6a;font-size:.52rem;margin-top:1px}

/* HIST */
.hist-lbl{font-size:.45rem;color:#4a4a6a;letter-spacing:2px;text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;gap:4px}
.hist-lbl::before{content:'';width:2px;height:7px;background:#7c3aed;border-radius:1px}
.hist-stats{display:flex;gap:7px;margin-bottom:5px;font-size:.58rem}
.hw{color:#10b981;font-weight:700}.hl{color:#ef4444;font-weight:700}.hp{color:#7c3aed;font-weight:700;margin-right:auto}
.hist-list{display:flex;flex-direction:column;gap:3px;margin-bottom:16px}
.hi{background:#111118;border:1px solid #1a1a2e;border-radius:5px;padding:5px 9px;display:flex;justify-content:space-between;align-items:center;border-left:2px solid transparent}
.hi.call{border-left-color:#10b981}.hi.put{border-left-color:#ef4444}
.hd{font-family:monospace;font-weight:700;font-size:.6rem}
.hd.call{color:#10b981}.hd.put{color:#ef4444}
.hc{font-family:monospace;font-size:.6rem;color:#7c3aed}
.ht{font-size:.5rem;color:#f59e0b}
.hr{font-size:.68rem}
.hm{font-size:.48rem;color:#4a4a6a}
.no-hist{text-align:center;color:#4a4a6a;padding:12px;font-size:.6rem}

footer{text-align:center;font-size:.45rem;color:#2a2a3a;border-top:1px solid #1a1a2e;padding-top:8px;line-height:2}
</style>
</head>
<body>
<div class="app">

<div class="hdr">
  <div class="logo">SIGNAL ⚡</div>
  <div class="clk" id="clk">--:--:--</div>
</div>

<div class="sessions" id="sess"></div>

<div class="mkt stop" id="mkt">
  <span class="mkt-icon" id="mi">⛔</span>
  <div><span class="mkt-t" id="mt">جاري...</span><span class="mkt-s" id="ms"></span></div>
</div>

<div class="chart-wrap">
  <div class="chart-top">
    <span class="chart-lbl">EUR/USD · TradingView · مباشر</span>
    <span class="chart-tf" id="ctf">● 1 دقيقة</span>
  </div>
  <iframe id="tv" src="https://s.tradingview.com/widgetembed/?symbol=FX%3AEURUSD&interval=1&theme=dark&style=1&locale=ar&timezone=Asia%2FRiyadh&hide_top_toolbar=1&hide_legend=0&save_image=0&hide_volume=0" allowtransparency="true" frameborder="0" scrolling="no" allowfullscreen></iframe>
</div>

<div class="row">
  <div class="tf-grp">
    <button class="tf on" onclick="setTF('1',this)">1د</button>
    <button class="tf" onclick="setTF('5',this)">5د</button>
  </div>
  <button class="btn" id="btn" onclick="run()">⚡ تحليل</button>
  <button class="btn-r" onclick="location.reload()">↺</button>
</div>

<div class="sig" id="sig">
  <div class="sig-body">
    <div class="sig-sub">EUR / USD · SIGNAL ENGINE</div>
    <div class="sig-arrow" id="sa">⚡</div>
    <span class="sig-dir wait" id="sd">اضغط تحليل</span>
    <span class="sig-grade gw" id="sg">—</span>
    <div class="sig-info" id="si"></div>
  </div>
  <div class="conf" id="conf">
    <div class="conf-r"><span>قوة الإشارة</span><span class="conf-v" id="cv">0%</span></div>
    <div class="conf-bar"><div class="conf-fill" id="cf"></div></div>
  </div>
  <div class="agree" id="agree">
    <div class="agree-lbl">توافق المؤشرات</div>
    <div class="agree-segs" id="as"></div>
    <span class="agree-n" id="an"></span>
  </div>
  <div class="tags" id="tags"></div>
</div>

<div class="pat" id="pat">
  <span>🕯️</span>
  <div><div class="pat-n" id="pn"></div><div class="pat-d" id="pd"></div></div>
</div>

<div class="tmr" id="tmr">
  <span style="font-size:.85rem">⏱</span>
  <div class="tmr-body">
    <div class="tmr-lbl">ادخل في Expert Option</div>
    <div class="tmr-val" id="tv2">--:--</div>
    <div class="tmr-bar"><div class="tmr-fill" id="tf2" style="width:0%"></div></div>
  </div>
  <div class="tmr-tf">الإطار<b id="ttf">—</b></div>
</div>

<div class="hist-lbl">آخر التوصيات</div>
<div id="hist"><div class="no-hist">⚡ اضغط تحليل للبدء</div></div>

<footer>SIGNAL ENGINE · EUR/USD · ريد ون 🔴 × عتيق · التداول ينطوي على مخاطر</footer>
</div>

<script>
// ═══ CONFIG ═══
const API = 'a16e72269b854e348b1adc5a3e8c3387';
const PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + u,
  u => 'https://cors-anywhere.herokuapp.com/' + u
];

let C = [], TF = '1', tmrInt = null, H = [];

// ═══ FETCH ═══
async function getData() {
  const m = {'1':'1min','5':'5min'};
  const url = `https://api.twelvedata.com/time_series?symbol=EUR/USD&interval=${m[TF]}&outputsize=${TF==='5'?60:100}&apikey=${API}`;
  for(const p of PROXIES) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 7000);
      const r = await fetch(p(url), {signal: ctrl.signal});
      clearTimeout(t);
      if(!r.ok) continue;
      const d = await r.json();
      if(d?.values?.length) return d;
    } catch(e) { continue; }
  }
  return null;
}

// ═══ SESSIONS ═══
const S = [
  {n:'سيدني',f:'🇦🇺',o:21,c:6,w:true},
  {n:'طوكيو',f:'🇯🇵',o:0,c:9,w:false},
  {n:'لندن',f:'🇬🇧',o:7,c:16,w:false},
  {n:'نيويورك',f:'🇺🇸',o:12,c:21,w:false}
];
function isOn(s,h,m){const n=h*60+m;if(s.w){const a=n<s.o*60?n+1440:n;return a>=s.o*60&&a<s.c*60+1440;}return n>=s.o*60&&n<s.c*60;}
function mktOn(){const n=new Date(),d=n.getUTCDay(),h=n.getUTCHours(),m=n.getUTCMinutes();if(d===0||d===6||(d===5&&h>=21))return false;return isOn(S[2],h,m)||isOn(S[3],h,m);}
function nxt(){const d=new Date().getUTCDay(),h=new Date().getUTCHours();if(d===0||d===6||(d===5&&h>=21))return'يفتح الاثنين 10:00 ص';if(h<7)return'لندن 10:00 ص';return'نيويورك حتى 00:00';}

function drawSess(){
  const h=new Date().getUTCHours(),m=new Date().getUTCMinutes(),ov=h*60+m>=12*60&&h*60+m<16*60;
  document.getElementById('sess').innerHTML=S.map(s=>{
    const on=isOn(s,h,m),best=on&&(s.n==='لندن'||s.n==='نيويورك')&&ov;
    const cls=best?'best':on?'on':'';const sc=best?'best':on?'on':'off';const st=best?'⭐':on?'ON':'—';
    return`<div class="sess ${cls}"><span class="sess-f">${s.f}</span><span class="sess-n">${s.n}</span><span class="sess-s ${sc}">${st}</span></div>`;
  }).join('');
  const lon=isOn(S[2],h,m),ny=isOn(S[3],h,m),ro=mktOn();
  const mk=document.getElementById('mkt');
  if(ov&&lon&&ny){mk.className='mkt fire';document.getElementById('mi').textContent='🔥';document.getElementById('mt').textContent='تداخل لندن × نيويورك — أفضل وقت';document.getElementById('ms').textContent='أعلى سيولة في اليوم';}
  else if((lon||ny)&&ro){mk.className='mkt go';document.getElementById('mi').textContent='✅';document.getElementById('mt').textContent=lon?'لندن مفتوحة':'نيويورك مفتوحة';document.getElementById('ms').textContent='EUR/USD نشط';}
  else{mk.className='mkt stop';document.getElementById('mi').textContent='⛔';document.getElementById('mt').textContent='السوق مغلق';document.getElementById('ms').textContent=nxt();}
  const btn=document.getElementById('btn');btn.disabled=!ro;
}

function setTF(tf,el){
  TF=tf;document.querySelectorAll('.tf').forEach(b=>b.classList.remove('on'));el.classList.add('on');
  document.getElementById('ctf').textContent='● '+(tf==='1'?'1 دقيقة':'5 دقائق');
  document.getElementById('tv').src=`https://s.tradingview.com/widgetembed/?symbol=FX%3AEURUSD&interval=${tf}&theme=dark&style=1&locale=ar&timezone=Asia%2FRiyadh&hide_top_toolbar=1&hide_legend=0&save_image=0&hide_volume=0`;
}

// ═══ MATH ═══
const ema=(a,p)=>{if(a.length<p)return a[a.length-1]||0;const k=2/(p+1);let e=a.slice(0,p).reduce((x,y)=>x+y)/p;for(let i=p;i<a.length;i++)e=a[i]*k+e*(1-k);return+e.toFixed(5);};
const rsi=(a,p=14)=>{if(a.length<p+1)return 50;let g=0,l=0;for(let i=a.length-p;i<a.length;i++){const d=a[i]-a[i-1];d>0?g+=d:l-=d;}return+(100-100/(1+g/p/(l/p||1e-9))).toFixed(2);};
const macd=a=>+(ema(a,12)-ema(a,26)).toFixed(6);
const stoch=(c,p=14)=>{if(c.length<p)return 50;const s=c.slice(-p),hh=Math.max(...s.map(x=>x.h)),ll=Math.min(...s.map(x=>x.l));return+((c[c.length-1].c-ll)/(hh-ll||1e-9)*100).toFixed(2);};
const bb=(a,p=20)=>{if(a.length<p)return 0.5;const s=a.slice(-p),m=s.reduce((x,y)=>x+y)/p,sd=Math.sqrt(s.map(x=>(x-m)**2).reduce((x,y)=>x+y)/p);return+((a[a.length-1]-(m-2*sd))/(4*sd||1e-9)).toFixed(3);};
const atr=(c,p=14)=>{if(c.length<p+1)return 0;return c.slice(-p).map((x,i,a)=>i===0?x.h-x.l:Math.max(x.h-x.l,Math.abs(x.h-a[i-1].c),Math.abs(x.l-a[i-1].c))).reduce((a,b)=>a+b)/p;};

// ═══ PATTERN ═══
function pat(c){
  if(c.length<3)return null;
  const[c2,c1,c0]=c.slice(-3);
  const bd=x=>Math.abs(x.c-x.o),rn=x=>x.h-x.l||1e-9,bu=x=>x.c>x.o,be=x=>x.c<x.o,dj=x=>bd(x)/rn(x)<0.12;
  const lw=x=>Math.min(x.o,x.c)-x.l,uw=x=>x.h-Math.max(x.o,x.c);
  if(dj(c0))return{n:'دوجي',d:bu(c1)?'PUT':'CALL',ds:'تردد — انعكاس محتمل',s:2};
  if(be(c1)&&bu(c0)&&c0.o<c1.c&&c0.c>c1.o)return{n:'ابتلاع صعودي ✅',d:'CALL',ds:'انعكاس صعودي قوي',s:3};
  if(bu(c1)&&be(c0)&&c0.o>c1.c&&c0.c<c1.o)return{n:'ابتلاع هبوطي ✅',d:'PUT',ds:'انعكاس هبوطي قوي',s:3};
  if(bu(c0)&&lw(c0)>bd(c0)*1.8&&uw(c0)<bd(c0)*0.4)return{n:'مطرقة 🔨',d:'CALL',ds:'ارتداد من الدعم',s:3};
  if(be(c0)&&uw(c0)>bd(c0)*1.8&&lw(c0)<bd(c0)*0.4)return{n:'نجمة هاوية ⭐',d:'PUT',ds:'رفض المقاومة',s:3};
  if(bu(c2)&&bu(c1)&&bu(c0)&&c0.c>c1.c&&c1.c>c2.c)return{n:'3 جنود بيض 🚀',d:'CALL',ds:'زخم صاعد قوي',s:4};
  if(be(c2)&&be(c1)&&be(c0)&&c0.c<c1.c&&c1.c<c2.c)return{n:'3 غربان سود 📉',d:'PUT',ds:'زخم هابط قوي',s:4};
  if(be(c2)&&dj(c1)&&bu(c0)&&c0.c>(c2.o+c2.c)/2)return{n:'نجمة الصباح ✅',d:'CALL',ds:'انعكاس صعودي مؤكد',s:4};
  if(bu(c2)&&dj(c1)&&be(c0)&&c0.c<(c2.o+c2.c)/2)return{n:'نجمة المساء ✅',d:'PUT',ds:'انعكاس هبوطي مؤكد',s:4};
  return null;
}

// ═══ STRATEGY ═══
function strategy(){
  if(C.length<30||atr(C)<0.00012)return null;
  const cl=C.map(x=>x.c),r=rsi(cl),mv=macd(cl),st=stoch(C),e9=ema(cl,9),e21=ema(cl,21),bv=bb(cl);
  const l10=cl.slice(-10),l30=cl.slice(-30);
  const sTr=l10[9]>l10[0]?'up':'down',lTr=l30[29]>l30[0]?'up':'down',tA=sTr===lTr;
  const lc=C[C.length-1],cs=Math.abs(lc.c-lc.o)/(lc.h-lc.l||1e-9)>0.35;
  const p=pat(C);
  let bs=0,ss=0,br=[],sr=[];

  if(r<25){bs+=4;br.push({t:`RSI ${r} ذروة بيع حاد`,c:'tb'})}
  else if(r<35){bs+=3;br.push({t:`RSI ${r} ذروة بيع`,c:'tb'})}
  else if(r<42){bs+=1;br.push({t:`RSI ${r} دعم`,c:'tb'})}
  else if(r>75){ss+=4;sr.push({t:`RSI ${r} ذروة شراء حاد`,c:'tr'})}
  else if(r>65){ss+=3;sr.push({t:`RSI ${r} ذروة شراء`,c:'tr'})}
  else if(r>58){ss+=1;sr.push({t:`RSI ${r} مقاومة`,c:'tr'})}

  if(mv>0.00015){bs+=3;br.push({t:'MACD صعودي قوي',c:'tb'})}
  else if(mv>0.00005){bs+=1;br.push({t:'MACD إيجابي',c:'tb'})}
  else if(mv<-0.00015){ss+=3;sr.push({t:'MACD هبوطي قوي',c:'tr'})}
  else if(mv<-0.00005){ss+=1;sr.push({t:'MACD سلبي',c:'tr'})}

  if(st<15){bs+=3;br.push({t:`Stoch ${st} بيع مفرط`,c:'tb'})}
  else if(st<28){bs+=1;br.push({t:`Stoch ${st} دعم`,c:'tb'})}
  else if(st>85){ss+=3;sr.push({t:`Stoch ${st} شراء مفرط`,c:'tr'})}
  else if(st>72){ss+=1;sr.push({t:`Stoch ${st} مقاومة`,c:'tr'})}

  const ed=e9-e21;
  if(ed>0.0005){bs+=3;br.push({t:'EMA9 > EMA21 بقوة',c:'tb'})}
  else if(ed>0.0001){bs+=1;br.push({t:'EMA تقاطع صاعد',c:'tb'})}
  else if(ed<-0.0005){ss+=3;sr.push({t:'EMA9 < EMA21 بقوة',c:'tr'})}
  else if(ed<-0.0001){ss+=1;sr.push({t:'EMA تقاطع هابط',c:'tr'})}

  if(bv<0.06){bs+=3;br.push({t:'BB حد سفلي — ارتداد',c:'tb'})}
  else if(bv<0.2){bs+=1;br.push({t:'BB منطقة شراء',c:'tb'})}
  else if(bv>0.94){ss+=3;sr.push({t:'BB حد علوي — رفض',c:'tr'})}
  else if(bv>0.8){ss+=1;sr.push({t:'BB منطقة بيع',c:'tr'})}

  if(sTr==='up'&&tA){bs+=2;br.push({t:'اتجاه صاعد متوافق',c:'tb'})}
  else if(sTr==='up'){bs+=1;br.push({t:'اتجاه صاعد',c:'tb'})}
  else if(sTr==='down'&&tA){ss+=2;sr.push({t:'اتجاه هابط متوافق',c:'tr'})}
  else if(sTr==='down'){ss+=1;sr.push({t:'اتجاه هابط',c:'tr'})}

  if(cs&&lc.c>lc.o){bs+=1;br.push({t:'شمعة صاعدة قوية',c:'tb'})}
  else if(cs&&lc.c<lc.o){ss+=1;sr.push({t:'شمعة هابطة قوية',c:'tr'})}

  if(p){if(p.d==='CALL'){bs+=p.s;br.push({t:'🕯️ '+p.n,c:'tb'})}else{ss+=p.s;sr.push({t:'🕯️ '+p.n,c:'tr'})}}

  const tfS=TF==='1'?60:300,tfL=TF==='1'?'1 دقيقة ⚡':'5 دقائق',exTF=TF==='1'?'0:45':'4:30',mx=22;
  const isDm=d=>{
    if(d==='CALL')return r<38&&mv>0.00005&&e9>e21&&bv<0.18&&st<30&&tA&&sTr==='up'&&p?.d==='CALL';
    return r>62&&mv<-0.00005&&e9<e21&&bv>0.82&&st>70&&tA&&sTr==='down'&&p?.d==='PUT';
  };
  const isCf=d=>{
    if(d==='CALL')return r<45&&mv>0.00003&&e9>e21&&bv<0.25&&sTr!=='down';
    return r>55&&mv<-0.00003&&e9<e21&&bv>0.75&&sTr!=='up';
  };

  if(bs>=6&&bs>ss+2){
    const cf=Math.min(96,Math.round(56+(bs/mx)*41));
    const dm=isDm('CALL'),c2=!dm&&isCf('CALL');
    const st2=dm?'💎 شراء ماسي':c2?'🟢 شراء مؤكد':bs>=14?'🔥 شراء قوي جداً':bs>=9?'✅ شراء قوي':'شراء محتمل';
    return{d:'CALL',cf:dm?98:c2?Math.min(97,cf+7):cf,dm,c2,tags:br.slice(0,5),tfS,tfL,exTF,st:st2,ag:bs,p,r,mv,st:stoch(C),e9,e21,bv};
  }
  if(ss>=6&&ss>bs+2){
    const cf=Math.min(96,Math.round(56+(ss/mx)*41));
    const dm=isDm('PUT'),c2=!dm&&isCf('PUT');
    const st2=dm?'💎 بيع ماسي':c2?'🔴 بيع مؤكد':ss>=14?'🔥 بيع قوي جداً':ss>=9?'✅ بيع قوي':'بيع محتمل';
    return{d:'PUT',cf:dm?98:c2?Math.min(97,cf+7):cf,dm,c2,tags:sr.slice(0,5),tfS,tfL,exTF,st:st2,ag:ss,p,r,mv,e9,e21,bv};
  }
  return null;
}

// ═══ RUN ═══
async function run(){
  if(!mktOn()){alert('السوق مغلق — انتظر لندن أو نيويورك');return;}
  const btn=document.getElementById('btn');
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
  const data=await getData();
  if(!data){
    btn.disabled=false;btn.innerHTML='⚡ تحليل';
    showNo('تعذر الاتصال — حاول مرة ثانية');return;
  }
  C=data.values.reverse().map(v=>({o:+v.open,h:+v.high,l:+v.low,c:+v.close}));
  const sig=strategy();
  if(sig){showSig(sig);addH(sig);startT(sig.tfS,sig.tfL);if(sig.dm)playDm();else if(sig.c2)playCf(sig.d);}
  else{showNo('لا توجد إشارة — المؤشرات متضاربة');}
  btn.disabled=false;btn.innerHTML='⚡ تحليل';
}

// ═══ UI ═══
function showSig(s){
  const card=document.getElementById('sig');
  card.className='sig '+(s.dm?'dm':s.d==='CALL'?'call':'put');
  document.getElementById('sa').textContent=s.dm?'💎':s.d==='CALL'?'📈':'📉';
  const dir=document.getElementById('sd');
  dir.textContent=s.d==='CALL'?'⬆  CALL  شراء':'⬇  PUT  بيع';
  dir.className='sig-dir '+(s.dm?'dm':s.d==='CALL'?'call':'put');
  const gr=document.getElementById('sg');gr.textContent=s.st;
  gr.className='sig-grade '+(s.dm?'gm':s.d==='CALL'?'gd':'gp');
  const entry=C.length?C[C.length-1].c.toFixed(5):'--';
  document.getElementById('si').innerHTML=`<span class="badge bt">⏱ ${s.tfL}</span><span class="badge be">${entry}</span><span class="badge bg">EO: ${s.exTF}</span>`;
  document.getElementById('conf').style.display='block';
  document.getElementById('cv').textContent=s.cf+'%';
  const fill=document.getElementById('cf');fill.style.width=s.cf+'%';
  fill.className='conf-fill '+(s.dm?'cf-dm':s.cf>=80?'cf-hi':s.cf>=65?'cf-md':'cf-lo');
  document.getElementById('agree').style.display='block';
  const segs=5,on=Math.min(segs,Math.round(s.ag/4));
  const sc=s.dm?'dm':s.d==='CALL'?'call':'put';
  document.getElementById('as').innerHTML=Array(segs).fill(0).map((_,i)=>`<div class="seg ${i<on?'on '+sc:''}"></div>`).join('');
  document.getElementById('an').textContent=`${s.ag}/22 توافق`;
  let tags=s.tags.map(t=>`<span class="tag ${t.c}">${t.t}</span>`).join('');
  if(s.dm)tags+='<span class="tag tv">💎 ماسية</span>';
  else if(s.c2)tags+='<span class="tag tv">✅ مؤكدة</span>';
  document.getElementById('tags').innerHTML=tags;
  if(s.p){document.getElementById('pn').textContent=s.p.n;document.getElementById('pd').textContent=s.p.ds;document.getElementById('pat').classList.add('show');}
  else document.getElementById('pat').classList.remove('show');
}
function showNo(msg){
  document.getElementById('sig').className='sig';
  document.getElementById('sa').textContent='⏳';
  document.getElementById('sd').textContent=msg;document.getElementById('sd').className='sig-dir wait';
  document.getElementById('sg').textContent='—';document.getElementById('sg').className='sig-grade gw';
  document.getElementById('si').innerHTML='';
  document.getElementById('conf').style.display='none';
  document.getElementById('agree').style.display='none';
  document.getElementById('tags').innerHTML='<span class="tag tn">انتظر وحاول مجدداً</span>';
  document.getElementById('pat').classList.remove('show');
  stopT();
}
function addH(s){
  const e=C.length?C[C.length-1].c:0;
  const t={d:s.d,cf:s.cf,tf:s.tfL,e,time:new Date().toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'}),r:null,dm:s.dm,c2:s.c2};
  H.unshift(t);if(H.length>20)H.pop();
  setTimeout(async()=>{
    const data=await getData();if(!data||!data.values)return;
    const nc=data.values.reverse().map(v=>({c:+v.close}));
    const ex=nc[nc.length-1].c;t.r=(t.d==='CALL'?ex>t.e:ex<t.e)?'win':'loss';drawH();
  },s.tfS*1000);
  drawH();
}
function drawH(){
  const w=H.filter(h=>h.r==='win').length,l=H.filter(h=>h.r==='loss').length,tot=w+l;
  const stats=tot>0?`<div class="hist-stats"><span class="hw">✅ ${w}</span><span class="hl">❌ ${l}</span><span class="hp">نسبة النجاح: ${Math.round(w/tot*100)}%</span></div>`:'';
  document.getElementById('hist').innerHTML=stats+`<div class="hist-list">${H.map(h=>{const res=h.r==='win'?'✅':h.r==='loss'?'❌':'⏳';const b=h.dm?'💎':h.c2?'🟢':'';return`<div class="hi ${h.d.toLowerCase()}"><span class="hd ${h.d.toLowerCase()}">${h.d==='CALL'?'⬆ CALL':'⬇ PUT'}</span><span>${b}</span><span class="hc">${h.cf}%</span><span class="ht">${h.tf}</span><span class="hr">${res}</span><span class="hm">${h.time}</span></div>`;}).join('')}</div>`;
}
function startT(sec,lbl){
  stopT();let rem=sec;
  const tb=document.getElementById('tmr'),tv=document.getElementById('tv2'),tf=document.getElementById('tf2'),tl=document.getElementById('ttf');
  tb.classList.add('on');tl.textContent=lbl;
  const tick=()=>{const m=Math.floor(rem/60),s=rem%60;tv.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;tf.style.width=((rem/sec)*100)+'%';if(rem<=0){stopT();return;}rem--;};
  tick();tmrInt=setInterval(tick,1000);
}
function stopT(){if(tmrInt)clearInterval(tmrInt);document.getElementById('tmr').classList.remove('on');document.getElementById('tv2').textContent='--:--';document.getElementById('tf2').style.width='0%';}

// ═══ SOUNDS ═══
function playCf(d){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const n=d==='CALL'?[[400,0],[550,.12],[720,.24],[900,.36],[1100,.48]]:[[1100,0],[900,.12],[720,.24],[550,.36],[400,.48]];n.forEach(([f,dl])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.5,ctx.currentTime+dl);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dl+.25);o.start(ctx.currentTime+dl);o.stop(ctx.currentTime+dl+.3);});}catch(e){}}
function playDm(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();[[300,0],[600,.1],[900,.2],[1200,.3],[1500,.4],[1800,.5],[1200,.7],[1800,.9]].forEach(([f,d])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.6,ctx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d+.2);o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+.25);});}catch(e){}}

// ═══ CLOCK ═══
function tick(){const n=new Date(),k=new Date(n.getTime()+3*3600000);document.getElementById('clk').textContent=`${String(k.getUTCHours()).padStart(2,'0')}:${String(k.getUTCMinutes()).padStart(2,'0')}:${String(k.getUTCSeconds()).padStart(2,'0')}`;}

// ═══ INIT ═══
tick();setInterval(tick,1000);
drawSess();setInterval(drawSess,30000);
</script>
